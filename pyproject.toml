[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-trading-engine"
version = "0.4.0"
description = "Modular Python trading engine with backtesting, paper trading and optional MetaTrader 5 adapter"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
